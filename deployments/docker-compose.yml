services:
  app:
    image: ${APP_IMAGE:-harbor.sdwks.com/other/crypto-watchtower:test-latest}
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE:-harbor.sdwks.com/common/golang:1.24}
    pull_policy: ${APP_PULL_POLICY:-always}
    container_name: crypto-watchtower-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_PATH: ${CONFIG_PATH:-/app/configs/config.example.yaml}
      CW_POSTGRES_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CryptoWatchtower_Test_2026!}@postgres:5432/${POSTGRES_DB:-crypto_watchtower}?sslmode=disable
      CW_REDIS_ADDR: redis:6379
      CW_REDIS_PASSWORD: ${REDIS_PASSWORD:-CryptoWatchtower_Test_2026!}
      CW_TELEGRAM_BOT_TOKEN: ${CW_TELEGRAM_BOT_TOKEN:-YOUR_BOT_TOKEN}
      CW_TELEGRAM_DEFAULT_CHAT_ID: ${CW_TELEGRAM_DEFAULT_CHAT_ID:-YOUR_CHAT_ID}
      CW_API_BEARER_TOKEN: ${CW_API_BEARER_TOKEN:-change-me}
      CW_BINANCE_ENABLED: ${CW_BINANCE_ENABLED:-true}
      CW_OKX_ENABLED: ${CW_OKX_ENABLED:-false}
      CW_OKX_PUBLIC_WS_BASE_URL: ${CW_OKX_PUBLIC_WS_BASE_URL:-wss://ws.okx.com:8443/ws/v5/public}
      CW_OKX_REST_BASE_URL: ${CW_OKX_REST_BASE_URL:-https://www.okx.com}
      CW_OKX_SYMBOLS: ${CW_OKX_SYMBOLS:-BTCUSDT}
      CW_WEBHOOK_ENABLED: ${CW_WEBHOOK_ENABLED:-false}
      CW_WEBHOOK_URL: ${CW_WEBHOOK_URL:-}
      CW_WEBHOOK_CHANNEL: ${CW_WEBHOOK_CHANNEL:-discord}
      CW_WEBHOOK_TIMEOUT_SEC: ${CW_WEBHOOK_TIMEOUT_SEC:-10}
      CW_SUMMARY_ENABLED: ${CW_SUMMARY_ENABLED:-false}
      CW_SUMMARY_INTERVAL_SEC: ${CW_SUMMARY_INTERVAL_SEC:-900}
      CW_SUMMARY_WINDOW_SEC: ${CW_SUMMARY_WINDOW_SEC:-900}
      CW_SUMMARY_MAX_ITEMS: ${CW_SUMMARY_MAX_ITEMS:-50}
      CW_SUMMARY_PROVIDER: ${CW_SUMMARY_PROVIDER:-template}
      CW_SUMMARY_DISCLAIMER: ${CW_SUMMARY_DISCLAIMER:-不构成投资建议}
      CW_SUMMARY_API_BASE_URL: ${CW_SUMMARY_API_BASE_URL:-}
      CW_SUMMARY_API_KEY: ${CW_SUMMARY_API_KEY:-}
      CW_SUMMARY_MODEL: ${CW_SUMMARY_MODEL:-}
      CW_SUMMARY_TIMEOUT_SEC: ${CW_SUMMARY_TIMEOUT_SEC:-15}
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"

  postgres:
    image: ${POSTGRES_IMAGE:-harbor.sdwks.com/common/postgres:16.14}
    pull_policy: ${MIDDLEWARE_PULL_POLICY:-always}
    container_name: crypto-watchtower-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_watchtower}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CryptoWatchtower_Test_2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crypto_watchtower}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-harbor.sdwks.com/common/redis:7.0.15}
    pull_policy: ${MIDDLEWARE_PULL_POLICY:-always}
    container_name: crypto-watchtower-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CryptoWatchtower_Test_2026!}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-CryptoWatchtower_Test_2026!}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
