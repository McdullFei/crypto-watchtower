<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CryptoWatchtower Admin</title>
    <link rel="stylesheet" href="/admin/app.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>CryptoWatchtower Admin</h1>
          <p>Operator Console</p>
        </div>
        <label class="token-field">
          <span>Bearer Token</span>
          <input id="token-input" type="password" placeholder="change-me">
        </label>
        <div class="filter-group">
          <h2>List Filters</h2>
          <label>
            <span>Symbol</span>
            <input id="filter-symbol" type="text" placeholder="BTCUSDT">
          </label>
          <label>
            <span>Event Type</span>
            <input id="filter-event-type" type="text" placeholder="agg_trade">
          </label>
          <label>
            <span>Rule Type</span>
            <input id="filter-rule-type" type="text" placeholder="large_trade">
          </label>
          <label>
            <span>Status</span>
            <select id="filter-status">
              <option value="">Any</option>
              <option value="sent">Sent</option>
              <option value="failed">Failed</option>
            </select>
          </label>
          <label>
            <span>Limit</span>
            <input id="filter-limit" type="number" min="1" max="200" value="8">
          </label>
        </div>
        <button id="reload-button" class="primary-button">Reload</button>
      </aside>
      <main class="content">
        <section class="hero">
          <div>
            <p class="eyebrow">Monitoring Console</p>
            <h2>Binance anomaly operations</h2>
          </div>
          <p id="status-text" class="muted">Ready.</p>
        </section>
        <section class="metrics" id="overview-grid"></section>
        <section class="panel">
          <div class="panel-header">
            <h3>Runtime Status</h3>
          </div>
          <div id="runtime-status" class="status-grid"></div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <h3>Trend Summary</h3>
          </div>
          <div id="trend-grid" class="metrics compact"></div>
          <div id="symbol-trends" class="table"></div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <h3>Rule Editor</h3>
          </div>
          <form id="rule-form" class="rule-form">
            <label>
              <span>Symbol</span>
              <input id="rule-symbol" type="text" placeholder="BTCUSDT" required>
            </label>
            <label>
              <span>Rule Type</span>
              <select id="rule-type">
                <option value="large_trade">large_trade</option>
                <option value="large_trade_window">large_trade_window</option>
                <option value="liquidation">liquidation</option>
                <option value="funding_anomaly">funding_anomaly</option>
              </select>
            </label>
            <label>
              <span>Threshold</span>
              <input id="rule-threshold" type="number" min="0" step="0.0001" required>
            </label>
            <label>
              <span>Window Sec</span>
              <input id="rule-window-sec" type="number" min="1" value="60">
            </label>
            <label class="checkbox-label">
              <input id="rule-enabled" type="checkbox" checked>
              <span>Enabled</span>
            </label>
            <button class="primary-button inline" type="submit">Save Rule</button>
          </form>
        </section>
        <section class="panel">
          <div class="panel-header">
            <h3>Rules</h3>
          </div>
          <div id="rules-table" class="table"></div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <h3>Alerts</h3>
          </div>
          <div id="alerts-table" class="table"></div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <h3>Alert Events</h3>
          </div>
          <div id="events-table" class="table"></div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <h3>Notifications</h3>
          </div>
          <div id="notifications-table" class="table"></div>
        </section>
      </main>
    </div>
    <script src="/admin/app.js"></script>
  </body>
  </html>
